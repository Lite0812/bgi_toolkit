[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgi-toolkit"
version = "0.1.0"
description = "BGI scripts, images with JSON metadata, ARC archives, and BF_Movie toolkit"
readme = {text = "BGI scripts, images with JSON metadata, ARC archives, and BF_Movie toolkit", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.6", "darkdetect>=0.8", "Pillow>=10.0"]
assets = ["Pillow>=10.0"]
image-processing = ["numpy>=1.24", "numba>=0.58", "opencv-python>=4.8"]
dev = ["pytest>=8"]

[project.scripts]
bgi-toolkit = "bgi_toolkit.cli:main"
bgi-toolkit-gui = "bgi_toolkit.gui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "artifacts/.pytest_cache"
norecursedirs = ["artifacts", "research", "samples", "dist", "build"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bgi_toolkit*"]

[tool.setuptools.package-data]
"bgi_toolkit.gui" = ["icons/*.svg"]
"bgi_toolkit.asdis" = ["resources/*.json"]
"bgi_toolkit.bsd2c" = ["builtin_defs.json"]

"bgi_toolkit" = ["locales/*.json", "native/*.dll", "native/*.c", "native/*.cpp", "native/*.h", "native/*.bat", "licenses/*.txt"]
